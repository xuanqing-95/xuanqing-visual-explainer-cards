schema_version: 2
topic: 早晨时间管理：每日聚焦三步法
audience: 想要提高每日时间管理效率的人

beginner_brief:
  prior_knowledge: 读者知道时间规划的基本概念，但常常每天很忙却感觉没有推进重要目标
  plain_definition: 每日聚焦三步法是一套日常时间管理循环——早晨定一件最重要的事，白天把复杂事项拆成三步并记录，晚上花五分钟回看并保留有效方法
  not_this: 它不是只写下任务就结束，还包括拆分步骤、完成后记录，以及晚上回看并复用有效方法
  how_it_works: 早晨先确定唯一优先事项以集中注意力，遇到复杂事项时拆成三个可执行步骤并在每步完成后简短记录，晚上用五分钟回看哪些方法有效，第二天继续复用
  why_it_matters: 它把注意力从做了很多事转移到推进了真正重要的目标，同时通过每日回看让有效方法可以被复用
  concrete_example: 早晨写下今天最重要的一件事，把它拆成三个轻量步骤，每完成一步做简短记录，晚上用五分钟回看结果，把有效的方法留着明天继续用
  next_action: 明天早晨先写下今天最重要的一件事，遇到复杂事项时拆成三个轻量步骤，晚上用五分钟回看结果

source_tags:
  - "#时间管理"
  - "#学习计划"
  - "#效率工具"

page_rhythm:
  strategy: 从一个关于忙碌却无效的熟悉问题进入，依次展开早晨定优先、白天拆步骤、晚上回看三个行动，每页更换布局和视觉重心，不做额外总结页
  beats:
    - page: 1
      purpose: 用熟悉问题建立阅读动机，引出每日聚焦三步法
      silhouette: huge-type-cover
      transition: open-with-question
    - page: 2
      purpose: 讲清早晨定一件最重要的事这个动作及其目的
      silhouette: image-led-hero
      transition: zoom-into-mechanism
    - page: 3
      purpose: 展开白天把复杂事项拆成三个轻量步骤并记录的行动
      silhouette: square-evidence
      transition: move-from-concept-to-action
    - page: 4
      purpose: 给出晚上五分钟回看并复用有效方法的具体行动
      silhouette: portrait-action-split
      transition: close-with-action

