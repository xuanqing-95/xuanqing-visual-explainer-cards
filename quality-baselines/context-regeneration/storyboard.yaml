schema_version: 2
topic: 上下文窗口（Context Window）
audience: 刚开始使用 AI 对话与 AI Coding 的小白用户

beginner_brief:
  prior_knowledge: 无需额外背景知识，只要用过 AI 对话即可
  plain_definition: 上下文窗口是 AI 每次回答时能够同时参考多少信息的"工作空间"，就像开卷考试时桌面能摊开的资料总量。
  not_this: 它不是 AI"能记住多少"的记忆能力，而是这一次回答时能同时放在眼前参考的信息量；聊天记录长不等于 AI 每次都能完整关注前面所有内容。
  how_it_works: AI 把聊天记录、要求、上传文件和代码都摆在"桌面"上回答问题；桌面空间以 Token 为单位计算且有限，资料越来越多时旧内容可能被移出桌面；不同模型窗口大小不同，处理超长内容时有截取、压缩总结、检索相关片段等不同方式，不一定总是简单"删除最早一句话"。
  why_it_matters: 在 AI Coding 中，代码、报错、截图和修改记录会不断占用上下文，如果重要规则只在最开始说过一次，聊到后面 AI 可能就无法继续稳定遵守，导致按钮被移动、原有组件被删除。
  concrete_example: 让 AI Coding 修改一个页面并在开始时强调"只更换视觉皮肤，不要改变原来的布局和功能"，经过多轮修改又加入大量截图、代码和报错记录后，AI 可能开始移动按钮甚至删除原有组件。
  next_action: 在一段较长的 AI 对话中，让它总结当前任务的目标、已经确认的决定、绝对不能修改的内容以及下一步要做什么，把这份总结保存下来再继续或开新对话。

source_tags:
  - 每天吃透一个AI知识点
  - AI学习
  - 上下文窗口
  - Token
  - AICoding

page_rhythm:
  strategy: 先用真实场景疑问切入，再用开卷考试桌面比喻建立直觉，接着补全 Token 与处理超长内容的机制，然后用 AI Coding 案例展示后果与解法，最后落到一个可立即执行的行动和一句金句。
  beats:
    - page: 1
      purpose: 用"AI 聊久了突然忘记前面要求"的真实场景疑问引出上下文窗口主题
      silhouette: huge-type-cover
      transition: open-with-question
    - page: 2
      purpose: 用开卷考试桌面的比喻解释上下文窗口是什么，桌面空间有限、资料多了旧内容会被移出
      silhouette: image-led-hero
      transition: zoom-into-mechanism
    - page: 3
      purpose: 说明 Token 是模型处理文字时切分的小单位，以及处理超长内容的三种不同方式
      silhouette: sidecar-mechanism
      transition: move-from-concept-to-signals
    - page: 4
      purpose: 用 AI Coding 改页面的案例说明长对话中重要规则会被遗忘，以及先总结再开新对话的解法
      silhouette: comparison-split
      transition: move-to-action
    - page: 5
      purpose: 给出今日行动（让 AI 总结目标、决定、约束、下一步）和一句金句收尾
      silhouette: compact-action-ledger
      transition: close-with-action

