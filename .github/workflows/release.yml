name: Publish approved Skill Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, matching package.json (for example v1.1.4)
        required: true

permissions:
  contents: write

jobs:
  verify-package-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify requested exact version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" != latest
          expected="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$expected"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
      - name: Build exact release package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          node scripts/package-release.mjs --commit "$GITHUB_SHA" --output "dist/xuanqing-visual-explainer-cards-${TAG}.tar.gz" > dist/package.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$TAG"
          "dist/xuanqing-visual-explainer-cards-${TAG}.tar.gz"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --notes "Validated public Skill package. See README for Codex ImageGen and user-provided API setup."
