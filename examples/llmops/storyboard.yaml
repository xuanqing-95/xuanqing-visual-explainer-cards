topic: LLMOps · Day 04
audience: 在用或想用 AI 做项目的开发者、产品、运营
accent: indigo-porcelain

beginner_brief:
  prior_knowledge: 用过聊天 AI,可能做过 demo,但不了解生产运维
  plain_definition: LLMOps 是把 prompt 管理、输出评估、成本控制和安全过滤工程化
  not_this: 它不是再训练一个模型,也不只是调 prompt
  why_it_matters: 同一个模型能否稳定上线,取决于有没有持续管理输入、输出、成本和风险
  concrete_example: 把写死在代码里的 prompt 迁到可配置平台,并让低分输出自动转人工

page_rhythm:
  - cover: 固定 S00 系列封面
  - metaphor: 横向解释插图
  - signals: 横向模型插图 + 三行信号说明
  - comparison: 横向模型插图 + 双列 Before / After
  - action: 横向模型插图 + 三段式行动选择

